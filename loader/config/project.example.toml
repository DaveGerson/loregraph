[project]
tenant_id = "personal"
workspace_dir = "../.loregraph"
schema_path = "../schema/canonical-profile.json"
backbone_path = "backbone.empty.json"

[parsing]
# auto: Docling when installed, otherwise PyMuPDF. Use docling explicitly for
# two-column books, tables, sidebars, or OCR.
backend = "auto"
ocr = false
remove_repeated_margins = true

[chunking]
# Retrieval context is recovered through NEXT_CHUNK graph links, so extraction
# chunks intentionally have zero overlap. This avoids paying twice for facts.
target_tokens = 700
max_tokens = 950
min_tokens = 80
atomic_max_tokens = 2600
overlap_tokens = 0

[extraction]
# none creates chunks, deterministic mentions, and a cost estimate without
# paid calls. openai enables synchronous extraction. openai_batch writes Batch
# API request JSONL for asynchronous processing.
provider = "none"
model = "gpt-5-mini"
prompt_version = "loregraph-v2"
mode = "changed"
confidence_threshold = 0.70
max_chunks = 500
max_input_tokens = 400000
max_output_tokens_per_chunk = 1200
max_estimated_cost_usd = 15.00
# Update these from the provider's current pricing page before a run. Zero means
# "price unknown" and disables the dollar gate; token and chunk gates still run.
input_price_per_million_usd = 0.0
output_price_per_million_usd = 0.0
batch_price_multiplier = 0.5
content_types = ["lore", "adventure", "rules", "item"]

[embeddings]
# Local embeddings are the recommended default for owned sourcebooks. Set to
# sentence_transformers after installing .[local-embeddings], or openai after
# explicitly opting individual books into remote processing.
provider = "none"
model = "Alibaba-NLP/gte-modernbert-base"
dimensions = 0
batch_size = 32
max_input_tokens = 5000000
vector_index_name = "chunk_embedding"

[resolution]
exact_alias = true
fuzzy_threshold = 0.94
review_threshold = 0.84

[neo4j]
enabled = false
database = "neo4j"
batch_size = 500
create_projection_edges = true
project_unreviewed = true

[mcp]
# Read-only agent access via `loregraph-mcp --config config/project.toml`.
# Without [mcp.connections.*], NEO4J_URI/USERNAME/PASSWORD/DATABASE are used.
max_rows = 200
query_timeout_seconds = 20
# auto: use local sentence_transformers query embeddings when [embeddings] uses
# them. Hosted (openai) query embedding is never inferred; set it explicitly.
query_embeddings = "auto"
# Raw Cypher is only permitted with the unrestricted owner audience.
allow_raw_cypher = false

[mcp.policy]
# player: PUBLIC+PLAYER, dm: +DM_ONLY, owner: +PRIVATE. The agent can narrow
# this per call but never widen it. --audience overrides it.
audience = "player"
review_statuses = ["ACCEPTED", "UNREVIEWED", "NEEDS_REVIEW"]

# Named connections. Values ending in _env name environment variables; secrets
# are never accepted inline.
# [mcp.connections.local]
# uri = "neo4j://localhost:7687"
# password_env = "NEO4J_LOCAL_PASSWORD"
#
# [mcp.connections.aura]
# uri_env = "NEO4J_URI"
# username_env = "NEO4J_USERNAME"
# password_env = "NEO4J_PASSWORD"
# database_env = "NEO4J_DATABASE"
#
# [mcp.connections.homelab]
# uri = "neo4j://graph.internal:7687"
# trusted_ca = "certs/homelab-ca.pem"
# password_env = "HOMELAB_NEO4J_PASSWORD"

[obsidian]
enabled = true
vault_path = "../output/LoreGraph"
write_chunk_notes = false
write_assertion_notes = true
include_superseded = false
max_quote_chars = 500
